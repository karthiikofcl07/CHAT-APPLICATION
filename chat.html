<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WhatsApp Style Chat</title>
  <link rel="stylesheet" href="s.css">
</head>
<body>
  <div class="chat-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <h2>Rooms</h2>
      <ul id="room-list">
        <li onclick="switchRoom('Sports')">Sports</li>
        <li onclick="switchRoom('Movies')">Movies</li>
        <li onclick="switchRoom('Coding')">Coding</li>
      </ul>
    </div>

    <!-- Chat Area -->
    <div class="chat-area">
      <div class="chat-header">
        <h3 id="room-name"></h3>
      </div>

      <div class="messages" id="messages"></div>

      <div class="chat-input">
        <input id="msg" placeholder="Type a message...">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    let username = localStorage.getItem("username");
    let room = localStorage.getItem("room");

    const roomNameEl = document.getElementById("room-name");
    const messagesEl = document.getElementById("messages");

    // Join room
    function joinRoom() {
      roomNameEl.textContent = room;
      messagesEl.innerHTML = "";
      socket.emit("joinRoom", { username, room });
    }
    joinRoom();

    // Receive messages
    socket.on("message", (message) => {
      const div = document.createElement("div");
      div.classList.add("message");
      
      // check if it's my message
      if (message.startsWith(username)) {
        div.classList.add("sent");
      } else {
        div.classList.add("received");
      }

      div.textContent = message;
      messagesEl.appendChild(div);

      // auto scroll
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });

    // Send message
    function sendMessage() {
      const msg = document.getElementById("msg").value;
      if (msg.trim()) {
        socket.emit("chatMessage", { username, room, msg });
        document.getElementById("msg").value = "";
      }
    }

    // Switch rooms
    function switchRoom(newRoom) {
      room = newRoom;
      localStorage.setItem("room", room);
      joinRoom();
    }
  </script>
</body>
</html>
